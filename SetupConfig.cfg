[MAIN]
User = hal # Your username
MesaSDK_Dir = /dark/hal/usr/mesasdk/ # Location of the SDK
NumThreads = 2 # Number of threads you want to use for the simulations
SimThreads = 2 # How many threads each simulation gets
SimMemory = 3 # How much memory you want to allocate to each simulation, in GB
TotMemory = 4 # How much memory you want to allocate to the whole scheduler
TimeoutTime = 10800 # Time (in seconds) that a simulation will be allowed to run for before being timed out
SimlistName = simlist.csv # Name of your simlist file, with extension
